# Frontend on Netlify. VITE_API_URL (the public backend, see ~/stacks/volly on qubit)
# is set in the Netlify UI. With no backend reachable the app runs in demo mode.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# React Router: serve index.html for every client-side route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
